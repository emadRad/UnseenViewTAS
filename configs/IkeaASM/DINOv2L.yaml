# IKEA ASM, DINOv2-L features, unseen view: dev3
TRAIN:
  DATASET: 'ikea_asm'
  EVAL_SPLIT: 'test'
  BATCH_SIZE: 3
  EVAL_PERIOD: 1
  CHECKPOINT_PERIOD: 1
  AUTO_RESUME: False
DATA:
  FRAME_SAMPLING_RATE: 1
  FEATURE_BACKBONE: "dinov2_vitl14_spatial"
  UNSEEN_EXO_VIEWS: ['dev3']
SOLVER:
  BASE_LR: 0.0008
  MAX_EPOCH: 40
  WEIGHT_DECAY: 5e-4
  CLIP_GRAD_L2NORM: 5.0
  WARMUP_FACTOR: 0.5
  WARMUP_EPOCHS: 5
  T_MAX: 60
MODEL:
  SEQUENCE_LOSS_WEIGHT: 0.5   # lambda
  ACTION_LOSS_WEIGHT: 0.2     # beta
  MSE_LOSS_FRACTION: 0.17
  NUM_CLASSES: 33
  PAD_IGNORE_IDX: 202
  INPUT_DIM: 1024
  LTC:
    NUM_LAYERS: 9
    NUM_STAGES: 4
    MODEL_DIM: 64
    WINDOWED_ATTN_W: 64
    LONG_TERM_ATTN_G: 64
    CHANNEL_MASKING_PROB: 0.3
    PREDICTOR_HEAD_STAGES: [False, False, False, True]
DATA_LOADER:
  NUM_WORKERS: 2
  PIN_MEMORY: True
NUM_GPUS: 1
LOG_PERIOD: 100
OUTPUT_DIR: ./experiments/ikea_asm
