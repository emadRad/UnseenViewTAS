# Assembly101, MViTv2-L features fine-tuned on the seen views
TRAIN:
  DATASET: 'assembly101'
  EVAL_SPLIT: 'val'
  BATCH_SIZE: 3
  EVAL_PERIOD: 1
  CHECKPOINT_PERIOD: 1
  AUTO_RESUME: False
DATA:
  FRAME_SAMPLING_RATE: 2
  FEATURE_BACKBONE: "mvit_tuned_assembly101_tempo_spatial_16x1_seen_views"
  UNSEEN_EXO_VIEWS: ['C10395_rgb', 'C10379_rgb']   # Exo7, Exo8
  UNSEEN_EGO_VIEWS: ['HMC_84355350_mono10bit',      # Ego1-Ego4
                     'HMC_84358933_mono10bit',
                     'HMC_21110305_mono10bit',
                     'HMC_21179183_mono10bit']
SOLVER:
  BASE_LR: 0.0008
  MAX_EPOCH: 40
  WEIGHT_DECAY: 5e-4
  CLIP_GRAD_L2NORM: 5.0
  WARMUP_FACTOR: 0.5
  WARMUP_EPOCHS: 5
  T_MAX: 60
MODEL:
  SEQUENCE_LOSS_WEIGHT: 0.5   # lambda
  ACTION_LOSS_WEIGHT: 0.2     # beta
  MSE_LOSS_FRACTION: 0.17
  NUM_CLASSES: 202
  PAD_IGNORE_IDX: 202
  INPUT_DIM: 1152
  LTC:
    NUM_LAYERS: 9
    NUM_STAGES: 4
    MODEL_DIM: 64
    WINDOWED_ATTN_W: 64
    LONG_TERM_ATTN_G: 64
    CHANNEL_MASKING_PROB: 0.3
    PREDICTOR_HEAD_STAGES: [False, False, False, True]
DATA_LOADER:
  NUM_WORKERS: 2
  PIN_MEMORY: True
NUM_GPUS: 1
LOG_PERIOD: 100
OUTPUT_DIR: ./experiments/assembly101
